:root {
  --bg: #fff6ea;
  --ink: #3e2723;
  --orange: #f57c00;
  --deep: #e65100;
  --card: #ffffff;
  --muted: #8d6e63;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  overflow: hidden;
}

.bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: linear-gradient(180deg, #ffb74d, #f57c00);
  color: #3e1d00;
}

.bar h1 { margin: 0; font-size: 22px; line-height: 1.1; }
.bar p { margin: 2px 0 0; font-size: 14px; }

.icon-btn, .tile, .letter, .chip, .swatch, .tool {
  min-height: 56px;
  border: 0;
  border-radius: 16px;
  font: inherit;
  font-weight: 800;
}

.icon-btn {
  width: 56px;
  background: #fff;
  color: var(--deep);
  font-size: 28px;
}

#screen {
  height: calc(100% - 68px);
  overflow: auto;
  padding: 12px;
  -webkit-overflow-scrolling: touch;
}

body.welcome-on .bar { display: none; }
body.welcome-on #screen {
  height: 100%;
  padding: 0;
  overflow: auto;
}

.welcome {
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 12px 20px;
  background-color: #2a1608;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
}

.welcome-card {
  width: min(560px, 100%);
  background: rgba(255, 246, 234, 0.94);
  border-radius: 22px;
  padding: 18px 16px 16px;
  text-align: center;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
}

.welcome-card h2 {
  margin: 0 0 8px;
  font-size: 22px;
  line-height: 1.25;
  color: #3e1d00;
}

.welcome-syl {
  justify-content: center;
  margin: 4px 0 12px;
}

.welcome-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.welcome-btn {
  min-height: 56px;
  padding: 0 28px;
  border: 0;
  border-radius: 16px;
  background: var(--deep);
  color: #fff;
  font: inherit;
  font-size: 20px;
  font-weight: 800;
  box-shadow: 0 4px 0 #bf360c;
}

.welcome-btn:active { transform: scale(0.97); }

.welcome-photo {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.welcome-photo .camera-btn {
  width: min(280px, 92%);
}

.welcome-photo img,
.welcome-photo-empty {
  width: min(240px, 52vw);
  height: min(240px, 52vw);
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 4px 0 #e0c3a0;
  background: #ffe0b2;
}

.welcome-photo-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 84px;
  border: 4px dashed #f57c00;
}

.camera-btn {
  min-height: 64px;
  padding: 0 22px;
  font-size: 20px;
  background: #1565c0;
  box-shadow: 0 4px 0 #0d47a1;
}

.camera-btn-lg {
  min-height: 68px;
  padding: 0 24px;
  font-size: 22px;
}

.camera-fab {
  width: 64px;
  height: 64px;
  min-height: 64px;
  font-size: 30px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
}

.tile-wrap {
  position: relative;
}

.tile {
  width: 100%;
  background: var(--card);
  box-shadow: 0 4px 0 #e0c3a0;
  padding: 0;
  overflow: hidden;
  text-align: left;
  color: inherit;
}

.sfx-fab {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 48px;
  height: 48px;
  min-height: 48px;
  border: 0;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.94);
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
  font-size: 22px;
  z-index: 2;
}

.sfx-fab:active { transform: scale(0.96); }

.tile img { width: 100%; height: 110px; object-fit: cover; display: block; }
.tile .meta { padding: 8px 10px 12px; }
.tile h2 { margin: 0; font-size: 18px; }
.tile small { color: var(--muted); }

.letters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.letters-page h3 {
  margin: 8px 4px 10px;
  font-size: 20px;
  color: var(--deep);
}

.letter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}

.letter-tile {
  min-height: 78px;
  border: 0;
  border-radius: 16px;
  background: #fff;
  color: var(--deep);
  box-shadow: 0 4px 0 #e0c3a0;
  font: inherit;
  font-weight: 800;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}

.letter-tile span { font-size: 32px; line-height: 1; }
.letter-tile small { font-size: 11px; color: var(--muted); font-weight: 700; }
.letter-tile.vowel { background: #fff3e0; }
.letter-tile.lesson { background: #fff8e1; outline: 3px solid #ffb74d; }
.letter-tile:active { transform: scale(0.97); }

.letter-lesson h3 {
  margin: 16px 4px 10px;
  font-size: 20px;
  color: var(--deep);
}

.lesson-syls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin: 8px 0 6px;
}

.lesson-syls .lesson-syl {
  min-width: 64px;
  min-height: 56px;
  cursor: pointer;
}

.phrase-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 0 0 24px;
}

.phrase-btn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  width: 100%;
  min-height: 64px;
  padding: 12px 16px;
  border: 0;
  border-radius: 16px;
  background: #fffde7;
  color: var(--deep);
  box-shadow: 0 4px 0 #ffd54f;
  font: inherit;
  font-weight: 800;
  text-align: left;
}

.phrase-btn span { font-size: 20px; line-height: 1.25; }
.phrase-btn small { font-size: 13px; color: var(--muted); font-weight: 700; }
.phrase-btn:active { transform: scale(0.99); }

.phrase-page {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 12px 8px 28px;
  text-align: center;
}

.phrase-kicker {
  margin: 0;
  font-size: 16px;
  font-weight: 800;
  color: #e65100;
}

.phrase-page h2 {
  margin: 0;
  font-size: clamp(28px, 6vw, 40px);
  line-height: 1.2;
}

.phrase-page .welcome-btn { min-width: 180px; }

.empty-letter {
  margin: 24px 8px;
  font-size: 18px;
  color: var(--muted);
}

.letter {
  width: 72px;
  height: 72px;
  font-size: 32px;
  background: #fff;
  color: var(--deep);
  box-shadow: 0 4px 0 #e0c3a0;
}

.letter:active, .tile:active, .chip:active { transform: scale(0.97); }

.paint {
  display: flex;
  flex-direction: column;
  height: 100%;
  gap: 8px;
}

.stage {
  position: relative;
  flex: 1;
  min-height: 240px;
  background: #fff;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: inset 0 0 0 3px #ffcc80;
  touch-action: none;
}

.stage img, .stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.stage img { object-fit: contain; filter: grayscale(0.15) contrast(1.05); }
.stage canvas { touch-action: none; }

.word-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.word-block {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.word-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.word-block h2, .word-row h2, .word-line h2 { margin: 0; font-size: 28px; }

.repeat-btn {
  min-height: 56px;
  padding: 0 18px;
  border: 0;
  border-radius: 16px;
  background: var(--deep);
  color: #fff;
  font: inherit;
  font-size: 18px;
  font-weight: 800;
  box-shadow: 0 4px 0 #bf360c;
}

.repeat-btn:active { transform: scale(0.97); }

.sfx-btn {
  background: #2e7d32;
  box-shadow: 0 4px 0 #1b5e20;
}

.syl {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  min-height: 52px;
}

.syl-chip {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 48px;
  min-height: 48px;
  padding: 0 10px;
  background: #fff;
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  color: #757575;
  font-size: 22px;
  font-weight: 800;
  transform: scale(1);
  transition: transform 0.15s, background 0.15s, color 0.15s, border-color 0.15s;
}

.syl-chip.on {
  background: #fff9c4;
  border-color: #fbc02d;
  color: #e65100;
  transform: scale(1.12);
  box-shadow: 0 4px 8px rgba(0,0,0,0.18);
  z-index: 2;
}

.palette {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.swatch {
  width: 48px;
  min-height: 48px;
  border-radius: 50%;
  box-shadow: 0 3px 0 rgba(0,0,0,0.15);
}

.swatch.on { outline: 4px solid #3e2723; }

.tool {
  padding: 0 14px;
  background: #fff3e0;
  color: var(--deep);
}

.hint { margin: 0; color: var(--muted); font-size: 13px; }

    </style>

  const onDuration = hooks && hooks.onDuration;
  const onEnded = hooks && hooks.onEnded;
  const capMs = (hooks && hooks.capMs) || 0;
  const token = playToken;
  if (!src) {
    if (onDuration) onDuration(0);
    if (onEnded) onEnded();
    return;
  }
  if (capMs > 0) {
    sfxCapTimer = setTimeout(() => {
      if (token !== playToken) return;
      stopPlayback();
    }, capMs);
  }
  if (window.LeeConmigo && typeof window.LeeConmigo.playAudio === "function") {
    let duration = 0;
    try {
      duration = window.LeeConmigo.playAudio(src) || 0;
    } catch (err) {
      duration = 0;
    }
    if (onDuration) onDuration(duration);
    if (onEnded) {
      setTimeout(() => {
        if (token !== playToken) return;
        onEnded();
      }, Math.max(duration, 280));
    }
    return;
  }
  try {
    if (player) {
      player.pause();
      player.removeAttribute("src");
    }
    player = new Audio(src);
    player.onloadedmetadata = () => {
      if (token !== playToken) return;
      if (onDuration) onDuration((player.duration || 0) * 1000);
    };
    player.onended = () => {
      if (token !== playToken) return;
      if (onEnded) onEnded();
    };
    player.play().catch(() => {
      if (token !== playToken) return;
      if (onDuration) onDuration(0);
      if (onEnded) onEnded();
    });
  } catch (err) {
    if (onDuration) onDuration(0);
    if (onEnded) onEnded();
  }
}

function playSfxOnly(card) {
  if (!card || !card.sfx) return;
  clearSylTimers();
  stopPlayback();
  playSrc(card.sfx, { capMs: SFX_MAX_MS });

function setBar(h, s, back) {
  title.textContent = h;
  subtitle.textContent = s;

function albumById(id) {
  return catalog.albums.find((a) => a.id === id);
}

function foldLetter(ch) {
  const map = { Á: "A", É: "E", Í: "I", Ó: "O", Ú: "U", Ü: "U" };
  const u = String(ch || "").toUpperCase();
  return map[u] || u;
}

function cardLetter(card) {
  if (card && card.letter) return foldLetter(card.letter);
  const w = card && card.word ? String(card.word).trim() : "";
  return w ? foldLetter(w[0]) : "";
}

function wordKey(word) {
  return String(word || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

function letterAudio(letter) {
  if (letter === "Ñ") return "audio/letra_enie.mp3";
  return "audio/letra_" + letter + ".mp3";
}

function lessonFor(letter) {
  const all = window.LESSONS || {};
  return all[letter] || null;
}

function silabaAudio(syl) {
  const key = String(syl || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
  return key ? "audio/sil_" + key + ".mp3" : "";
}

function findPhrase(letter, phraseId) {
  const lesson = lessonFor(letter);
  if (!lesson || !phraseId) return null;
  return (lesson.sentences || []).find((s) => s.id === phraseId) || null;
}

function letterMeta(letter) {
  const n = wordsForLetter(letter).length;
  const lesson = lessonFor(letter);
  const f = lesson ? (lesson.sentences || []).length : 0;
  if (f && n) return n + " pal. · " + f + " frases";
  if (f) return f === 1 ? "1 frase" : f + " frases";
  if (n) return n === 1 ? "1 palabra" : n + " palabras";
  return "Sin palabras";
}

function wordsForLetter(letter) {
  const buckets = [];
  const seen = new Set();
  SOURCE_ALBUMS.forEach((id) => {
    const album = albumById(id);
    if (!album) return;
    const items = [];
    album.cards.forEach((c) => {
      if (cardLetter(c) !== letter) return;
      const key = wordKey(c.word);
      if (!key || seen.has(key)) return;
      seen.add(key);
      items.push(c);
    });
    if (items.length) buckets.push(items);
  });
  const out = [];
  let i = 0;
  while (out.length < 5) {
    let added = false;
    buckets.forEach((b) => {
      if (out.length >= 5 || i >= b.length) return;
      out.push(b[i]);
      added = true;
    });
    if (!added) break;
    i += 1;
  }
  return out;
}

function findCardAnywhere(cardId) {
  for (let i = 0; i < catalog.albums.length; i += 1) {
    const album = catalog.albums[i];
    const card = album.cards.find((c) => c.id === cardId);
    if (card) return { album, card };
  }
  return null;
}

function letterTile(letter, kind) {
  const b = document.createElement("button");
  const hasLesson = !!lessonFor(letter);
  b.className =
    "letter-tile" +
    (kind === "vowel" ? " vowel" : "") +
    (hasLesson ? " lesson" : "");
  b.innerHTML = `<span>${letter}</span><small>${letterMeta(letter)}</small>`;
  b.onclick = () => renderLetter(letter);
  return b;
}

function nativeCamera() {
  return !!(window.LeeConmigo && typeof window.LeeConmigo.capturePhoto === "function");
}

function photoSrc(slot) {
  if (!slot) return "";
  if (nativeCamera() && typeof window.LeeConmigo.getPhoto === "function") {
    try {
      return window.LeeConmigo.getPhoto(slot) || "";
    } catch (err) {
      return "";
    }
  }
  try {
    return localStorage.getItem("foto:" + slot) || "";
  } catch (err) {
    return "";
  }
}

function hasPhoto(slot) {
  if (!slot) return false;
  if (nativeCamera() && typeof window.LeeConmigo.hasPhoto === "function") {
    try {
      return !!window.LeeConmigo.hasPhoto(slot);
    } catch (err) {
      return false;
    }
  }
  return !!photoSrc(slot);
}

function cardThumb(card) {
  if (card && card.camera) return photoSrc(card.camera) || PLACEHOLDER;
  return card && card.image ? card.image : PLACEHOLDER;
}

function requestPhoto(slot) {
  if (!slot) return;
  if (nativeCamera()) {
    try {
      window.LeeConmigo.capturePhoto(slot);
      return;
    } catch (err) {
      /* fallback */
    }
  }
  let input = $("photoInput");
  if (!input) {
    input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.setAttribute("capture", "environment");
    input.id = "photoInput";
    input.hidden = true;
    document.body.appendChild(input);
  }
  input.onchange = () => {
    const file = input.files && input.files[0];
    input.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        localStorage.setItem("foto:" + slot, reader.result);
      } catch (err) {
        /* ignore quota */
      }
      if (window.onLeePhoto) window.onLeePhoto(slot);
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function refreshAfterPhoto(slot) {
  if (slot === IGNACIO_SLOT) {
    renderWelcome();
    return;
  }
  if (route.card && route.letter && findPhrase(route.letter, route.card)) {
    renderPhrase(route.letter, route.card);
    return;
  }
  if (route.card) {
    renderPaint(route.album, route.card);
    return;
  }
  if (route.letter) {
    renderLetter(route.letter);
    return;
  }
  if (route.album) {
    renderItems(route.album);
  }
}

window.onLeePhoto = refreshAfterPhoto;

function clearSylTimers() {
  sylTimers.forEach(clearTimeout);
  sylTimers = [];
  silabeoToken += 1;
}

function renderSylRow(card, active) {
  const row = $("sylRow");
  if (!row) return;
  const syls = card.syllables || [];
  row.innerHTML = syls
    .map(
      (s, i) =>
        `<span class="syl-chip${i === active ? " on" : ""}">${s}</span>`
    )
    .join("");
}

function startSilabeo(card, durationMs) {
  const syls = card.syllables || [];
  clearSylTimers();
  const token = silabeoToken;
  renderSylRow(card, -1);
  if (!syls.length) return;
  const weights = syls.map((s) => 0.6 + String(s).length * 0.15);
  const totalW = weights.reduce((a, b) => a + b, 0);
  const total = durationMs > 250 ? durationMs : Math.round(totalW * 1000);
  let acc = 120;
  syls.forEach((_, i) => {
    const ms = Math.max(280, Math.round((weights[i] / totalW) * total));
    sylTimers.push(
      setTimeout(() => {
        if (token !== silabeoToken) return;
        renderSylRow(card, i);
      }, acc)
    );
    acc += ms;
  });
  sylTimers.push(
    setTimeout(() => {
      if (token !== silabeoToken) return;
      renderSylRow(card, -1);
    }, acc)
  );
}

function speakName(card) {
  if (!card) return;
  const src = audioSrcForCard(card);
  stopPlayback();
  playSrc(src, {
    onDuration: (duration) => startSilabeo(card, duration),
    onEnded: () => {
      if (card.sfx) playSrc(card.sfx, { capMs: SFX_MAX_MS });
    },
  });
}

  const phrases = lesson ? lesson.sentences || [] : [];

  setBar(
    "Letra " + letter,

  );
  if (!words.length && !phrases.length) {

        .map((s) => `<button type="button" class="syl-chip lesson-syl" data-syl="${s}">${s}</button>`)
        .join("")}</div>`
    : "";
  const wordsHtml = words.length
    ? `<h3>Palabras</h3><div class="grid" id="letterWords"></div>`
    : "";
  const phrasesHtml = phrases.length
    ? `<h3>Frases mágicas</h3><div class="phrase-list" id="phraseList"></div>`
    : "";
  screen.innerHTML = `
    <section class="letter-lesson">
      ${sylHtml}
      ${wordsHtml}
      ${phrasesHtml}

  const sylBox = $("lessonSyls");
  if (sylBox) {
    sylBox.querySelectorAll("[data-syl]").forEach((btn) => {
      btn.onclick = () => speakSyllable(btn.getAttribute("data-syl"));
    });

    words.forEach((c) => {

      wrap.className = "tile-wrap";

      b.className = "tile";

    ["Goma", () => (eraser = true)],
    ["Borrar", () => clearCanvas()],
  ].forEach(([label, fn]) => {
    const b = document.createElement("button");
    b.className = "tool";
    b.textContent = label;
    b.onclick = fn;
    pal.appendChild(b);
  });
  const wordBtn = $("wordBtn");
  if (wordBtn) {
    wordBtn.onclick = () => speakName(card);
  }
  const repeatBtn = $("repeatBtn");
  if (repeatBtn) {
    repeatBtn.onclick = () => speakName(card);
  }
  const sfxBtn = $("sfxBtn");
  if (sfxBtn) {
    sfxBtn.onclick = () => playSfxOnly(card);
  }
  const sylRow = $("sylRow");
  if (sylRow) {
    sylRow.onclick = () => speakName(card);
  }
  const paintCam = $("paintCam");
  if (paintCam) {
    paintCam.onclick = () => requestPhoto(card.camera);
  }
  if (ready) {
    setupCanvas();
    speakName(card);
  }
}

function setupCanvas() {
  const canvas = $("paint");
  if (!canvas) return;
  const stage = canvas.parentElement;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  let drawing = false;
  let last = null;

  function pos(ev) {
    const t = ev.touches ? ev.touches[0] : ev;
    const r = canvas.getBoundingClientRect();
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }

  function start(ev) {
    ev.preventDefault();
    drawing = true;
    last = pos(ev);
    draw(ev);
  }
  function move(ev) {
    if (!drawing) return;
    ev.preventDefault();
    draw(ev);
  }
  function end(ev) {
    ev.preventDefault();
    drawing = false;
    last = null;
  }
  function draw(ev) {
    const p = pos(ev);
    ctx.globalCompositeOperation = eraser ? "destination-out" : "source-over";
    ctx.strokeStyle = color;
    ctx.lineWidth = brush;
    ctx.globalAlpha = eraser ? 1 : 0.85;
    ctx.beginPath();
    if (last) ctx.moveTo(last.x, last.y);
    else ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  }

  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", end, { passive: false });
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  canvas.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", end);
  window._clearCanvas = () => ctx.clearRect(0, 0, w, h);
}

function clearCanvas() {
  if (window._clearCanvas) window._clearCanvas();
}

function goBack() {
  stopPlayback();
  if (route.card && route.letter) {
    renderLetter(route.letter);
    return true;
  }
  if (route.card) {
    renderItems(route.album);
    return true;
  }
  if (route.letter) {
    renderLetters();
    return true;
  }
  if (route.album) {
    renderHome();
    return true;
  }
  if (!atWelcome) {
    renderWelcome();
    return true;
  }
  return false;
}

window.appBack = goBack;
btnBack.onclick = goBack;

function showCatalogError(err) {
  screen.innerHTML =
    `<p>No pude cargar los álbumes (app ${APP_VERSION}). ${err}</p>` +
    `<p>Instala el APK Lee Conmigo 4.3 sobre la 4.2. LeeConmigo 5.0 puede quedarse.</p>`;
}

function bootCatalog(data) {
  if (!data || !Array.isArray(data.albums) || data.albums.length === 0) {
    throw new Error("El catálogo está vacío.");
  }
  catalog = data;
  renderWelcome();
}

function catalogFromAndroid() {
  try {
    if (!window.LeeConmigo || typeof window.LeeConmigo.getCatalog !== "function") {
      return null;
    }
    const raw = window.LeeConmigo.getCatalog();
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (err) {
    return null;
  }
}

function loadCatalog() {
  try {
    if (window.ALBUMS) {
      bootCatalog(window.ALBUMS);
      return;
    }
    const fromAndroid = catalogFromAndroid();
    if (fromAndroid) {
      bootCatalog(fromAndroid);
      return;
    }
    showCatalogError("Falta el catálogo embebido.");
  } catch (err) {
    showCatalogError(err);
  }
}

loadCatalog();

    </script>
