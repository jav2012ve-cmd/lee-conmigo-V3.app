    <style>
:root {
  --ink: #3e1d00;
  --deep: #e65100;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  background: #fff8e7;
  color: var(--ink);
  font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  overflow: hidden;
}

#book { height: 100%; }

.page {
  position: relative;
  height: 100%;
  background: #fff8e7;
}

.page img.art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

.caption {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 2;
  padding: 16px 28px 12px;
  display: flex;
  justify-content: center;
  pointer-events: none;
}

.line {
  margin: 0;
  max-width: 92vw;
  text-align: center;
  font-size: clamp(20px, 3vw, 34px);
  line-height: 1.25;
  font-weight: 800;
  color: #3e1d00;
  text-shadow:
    0 0 8px #fff8e7,
    0 1px 0 #fff,
    0 2px 8px rgba(255, 248, 231, 0.9);
  pointer-events: auto;
}

.actions {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 18px;
  z-index: 2;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
  padding: 0 20px;
  background: none;
}

.tv-btn {
  min-width: 160px;
  min-height: 64px;
  padding: 0 22px;
  border: 3px solid transparent;
  border-radius: 16px;
  background: #e65100;
  color: #fff;
  font: inherit;
  font-size: 22px;
  font-weight: 800;
  box-shadow: 0 4px 0 #bf360c;
}

.tv-btn:focus,
.tv-btn:focus-visible {
  outline: none;
  border-color: #fff59d;
  box-shadow: 0 0 0 4px #fff59d, 0 4px 0 #bf360c;
}

.tv-btn.ghost {
  background: #5d4037;
  box-shadow: 0 4px 0 #3e2723;
}

.tv-btn:disabled {
  opacity: 0.45;
}

.empty {
  display: grid;
  place-items: center;
  height: 100%;
  padding: 24px;
  text-align: center;
  font-size: 24px;
}

.home {
  height: 100%;
  padding: 28px 24px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: auto;
}

.home-kicker {
  margin: 0 0 6px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--deep);
}

.home h1 {
  margin: 0 0 22px;
  font-size: clamp(28px, 4vw, 42px);
  text-align: center;
}

.stories {
  width: 100%;
  max-width: 1100px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.story-card {
  display: flex;
  flex-direction: column;
  min-height: 280px;
  padding: 0;
  border: 4px solid transparent;
  border-radius: 20px;
  overflow: hidden;
  background: #fff;
  color: var(--ink);
  font: inherit;
  font-weight: 800;
  box-shadow: 0 6px 0 #d7ccc8;
  cursor: pointer;
}

.story-card img {
  display: block;
  width: 100%;
  height: 200px;
  object-fit: cover;
  background: #fff3e0;
}

.story-card span {
  display: block;
  padding: 16px 14px 18px;
  font-size: clamp(20px, 2.6vw, 26px);
  line-height: 1.2;
  text-align: center;
}

.story-card:focus,
.story-card:focus-visible {
  outline: none;
  border-color: #fff59d;
  box-shadow: 0 0 0 4px #fff59d, 0 6px 0 #bf360c;
}

@media (max-width: 640px) {
  .home {
    padding: 20px 14px 24px;
  }

  .stories {
    grid-template-columns: 1fr;
  }

  .story-card {
    min-height: 0;
  }

  .story-card img {
    height: 170px;
  }

  .tv-btn {
    min-width: 120px;
    min-height: 56px;
    font-size: 18px;
  }
}

    </style>

      player.pause();
      player.removeAttribute("src");
    } catch (err) {
      /* ignore */
    }
    player = null;
  }
}

function finishStoryIfLast(token) {
  if (token !== playToken) return;
  if (!story || !story.pages || !story.pages.length) return;
  if (index < story.pages.length - 1) return;
  setTimeout(() => {
    if (token !== playToken) return;
    if (!story) return;
    goHome();
  }, 800);
}

function playSrc(src, onEnded) {
  const token = playToken;
  if (!src) return;
  const done = () => {
    if (token !== playToken) return;
    if (onEnded) onEnded();
  };
  if (window.LeeConmigo && typeof window.LeeConmigo.playAudio === "function") {
    let duration = 0;
    try {
      duration = window.LeeConmigo.playAudio(src) || 0;
    } catch (err) {
      /* ignore */
    }
    window.appAudioEnded = done;
    if (duration > 0) {
      setTimeout(done, duration + 700);
    }
    return;
  }
  try {
    if (player) {
      player.pause();
      player.removeAttribute("src");
    }
    player = new Audio(src);
    player.onended = done;
    player.play().catch(() => {
      if (token !== playToken) return;
    });
  } catch (err) {
    /* ignore */
  }
}

function speakPage(card) {
  if (!card) return;
  stopPlayback();
  playSrc(card.audio, () => finishStoryIfLast(playToken));
}

function goHome() {
  stopPlayback();
  story = null;
  index = 0;
  renderHome();
}

function openStory(id) {
  const next = catalog.find((item) => item.id === id);
  if (!next || !next.pages || !next.pages.length) return;
  story = next;
  index = 0;
  renderPage();
}

function goTo(next) {
  if (!story) return;
  const last = story.pages.length - 1;
  if (next < 0) {
    goHome();
    return;
  }
  if (next > last) {
    goHome();
    return;
  }
  index = next;
  renderPage();
}

function renderHome() {
  stopPlayback();
  const root = $("book");
  if (!catalog.length) {
    root.innerHTML = `<p class="empty">No hay cuentos (app ${APP_VERSION}).</p>`;
    return;
  }
  if (homeFocus < 0 || homeFocus >= catalog.length) homeFocus = 0;
  const cards = catalog
    .map(
      (item, i) => `
      <button type="button" class="story-card" id="story-${item.id}" data-id="${item.id}">
        <img src="${item.cover}" alt="">
        <span>${item.title}</span>
      </button>`
    )
    .join("");
  root.innerHTML = `
    <section class="home">
      <p class="home-kicker">${APP_NAME}</p>
      <h1>Elige un cuento</h1>
      <div class="stories">${cards}</div>
    </section>`;
  catalog.forEach((item) => {
    const btn = $(`story-${item.id}`);
    if (btn) btn.onclick = () => openStory(item.id);
  });
  const focusBtn = $(`story-${catalog[homeFocus].id}`);
  if (focusBtn) focusBtn.focus();
}

function renderPage() {
  stopPlayback();
  const card = pageAt(index);
  const root = $("book");
  if (!card) {
    root.innerHTML = `<p class="empty">No pude cargar el cuento (app ${APP_VERSION}).</p>`;
    return;
  }
  const total = story.pages.length;
  root.innerHTML = `
    <section class="page">
      <img class="art" src="${card.image}" alt="">
      <header class="caption">
        <p class="line" id="wordBtn">${card.word}</p>
      </header>
      <div class="actions">
        <button type="button" class="tv-btn ghost" id="btnPrev">${index === 0 ? "← Cuentos" : "← Anterior"}</button>
        <button type="button" class="tv-btn" id="btnReplay">Oír de nuevo</button>
        <button type="button" class="tv-btn ghost" id="btnNext">${index >= total - 1 ? "Cuentos →" : "Siguiente →"}</button>
      </div>
    </section>`;
  const prev = $("btnPrev");
  const next = $("btnNext");
  const replay = $("btnReplay");
  const word = $("wordBtn");
  if (prev) {
    prev.onclick = () => goTo(index - 1);
  }
  if (next) {
    next.onclick = () => goTo(index + 1);
  }
  if (replay) replay.onclick = () => speakPage(card);
  if (word) word.onclick = () => speakPage(card);
  if (replay) replay.focus();
  speakPage(card);
}

function goBack() {
  stopPlayback();
  if (story) {
    if (index > 0) {
      goTo(index - 1);
      return true;
    }
    goHome();
    return true;
  }
  return false;
}

window.appBack = goBack;

document.addEventListener("keydown", (ev) => {
  const back =
    ev.key === "Escape" ||
    ev.key === "Backspace" ||
    ev.key === "GoBack" ||
    ev.keyCode === 4 ||
    ev.keyCode === 10009;
  if (back) {
    ev.preventDefault();
    if (!goBack() && window.LeeConmigo && typeof window.LeeConmigo.leave === "function") {
      window.LeeConmigo.leave();
    }
    return;
  }
  if (!story) {
    if (ev.key === "ArrowLeft") {
      ev.preventDefault();
      homeFocus = (homeFocus - 1 + catalog.length) % catalog.length;
      const btn = $(`story-${catalog[homeFocus].id}`);
      if (btn) btn.focus();
      return;
    }
    if (ev.key === "ArrowRight") {
      ev.preventDefault();
      homeFocus = (homeFocus + 1) % catalog.length;
      const btn = $(`story-${catalog[homeFocus].id}`);
      if (btn) btn.focus();
      return;
    }
    if (ev.key === "Enter" || ev.key === " " || ev.key === "OK") {
      ev.preventDefault();
      openStory(catalog[homeFocus].id);
    }
    return;
  }
  if (ev.key === "ArrowLeft") {
    ev.preventDefault();
    goTo(index - 1);
    return;
  }
  if (ev.key === "ArrowRight") {
    ev.preventDefault();
    goTo(index + 1);
    return;
  }
  if (ev.key === "Enter" || ev.key === " " || ev.key === "OK") {
    ev.preventDefault();
    speakPage(pageAt(index));
  }
});

function boot(data) {
  if (data && Array.isArray(data.stories) && data.stories.length) {
    catalog = data.stories.filter((item) => item && item.pages && item.pages.length);
  } else if (data && Array.isArray(data.pages) && data.pages.length) {
    catalog = [
      {
        id: "cuento",
        title: data.title || "Cuento",
        cover: data.pages[0].image,
        pages: data.pages,
      },
    ];
  } else {
    throw new Error("El libro está vacío.");
  }
  if (!catalog.length) throw new Error("El libro está vacío.");
  renderHome();
}

try {
  if (window.PAGES) {
    boot(window.PAGES);
  } else {
    throw new Error("Falta el libro embebido.");
  }
} catch (err) {
  $("book").innerHTML =
    `<p class="empty">No pude cargar el libro (app ${APP_VERSION}). ${err}</p>`;
}

    </script>
  </body>
</html>
